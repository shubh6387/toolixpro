<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="headerLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Header Logo Outer Box -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#headerLogoGrad)" />

  <!-- CPU Chip Icon (bi-cpu-fill) in white -->
  <g fill="#ffffff">
    <!-- Main Outer CPU Board -->
    <rect x="144" y="144" width="224" height="224" rx="32" />
    <!-- Inner Chip Core -->
    <rect x="192" y="192" width="128" height="128" rx="16" fill="#4f46e5" />
    <rect x="216" y="216" width="80" height="80" rx="8" fill="#ffffff" />
    
    <!-- Top Pins -->
    <rect x="176" y="80" width="24" height="48" rx="8" />
    <rect x="244" y="80" width="24" height="48" rx="8" />
    <rect x="312" y="80" width="24" height="48" rx="8" />

    <!-- Bottom Pins -->
    <rect x="176" y="384" width="24" height="48" rx="8" />
    <rect x="244" y="384" width="24" height="48" rx="8" />
    <rect x="312" y="384" width="24" height="48" rx="8" />

    <!-- Left Pins -->
    <rect x="80" y="176" width="48" height="24" rx="8" />
    <rect x="80" y="244" width="48" height="24" rx="8" />
    <rect x="80" y="312" width="48" height="24" rx="8" />

    <!-- Right Pins -->
    <rect x="384" y="176" width="48" height="24" rx="8" />
    <rect x="384" y="244" width="48" height="24" rx="8" />
    <rect x="384" y="312" width="48" height="24" rx="8" />
  </g>
</svg>
